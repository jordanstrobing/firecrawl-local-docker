name: build

# Daily: build when crates.io has a new firecrawl-local version.
# Weekly: rebuild anyway so Chromium and Debian security fixes land.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if this version is already published"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["Dockerfile", ".github/workflows/build.yml"]

permissions:
  contents: read
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || 'false' }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version=$(curl -fsS -A "firecrawl-local-docker (GitHub Actions)" \
            https://crates.io/api/v1/crates/firecrawl-local | jq -r .crate.max_version)
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          build=false
          if ! docker manifest inspect "$image:$version" >/dev/null 2>&1; then
            echo "New version $version"; build=true
          elif [ "$FORCE" = "true" ] || [ "$EVENT" = "push" ]; then
            echo "Forced rebuild"; build=true
          elif [ "$EVENT" = "schedule" ] && [ "$(date -u +%u)" = "1" ]; then
            echo "Weekly rebuild for base image updates"; build=true
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.plan.outputs.build == 'true'

      - uses: docker/login-action@v3
        if: steps.plan.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        if: steps.plan.outputs.build == 'true'
        with:
          context: .
          platforms: linux/arm64
          pull: true
          push: true
          build-args: FIRECRAWL_LOCAL_VERSION=${{ steps.plan.outputs.version }}
          tags: |
            ${{ steps.plan.outputs.image }}:latest
            ${{ steps.plan.outputs.image }}:${{ steps.plan.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: steps.plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          img="${{ steps.plan.outputs.image }}:${{ steps.plan.outputs.version }}"
          docker run --rm "$img" --version
          docker run -d --name fc -p 3002:3002 -e FIRECRAWL_LOCAL_TOKEN=ci-test -e FIRECRAWL_CLOUD=off "$img"
          for i in $(seq 1 20); do curl -fsS localhost:3002/health && break; sleep 1; done
          curl -fsS localhost:3002/v2/scrape -H 'authorization: Bearer ci-test' \
            -H 'content-type: application/json' \
            -d '{"url":"https://example.com","formats":["markdown"]}' | jq -e '.data.markdown | length > 0'
          docker logs fc
