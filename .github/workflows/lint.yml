name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Workflows (actionlint, which shellchecks run steps)
        run: |
          docker run --rm -v "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -color

      - name: Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0

      - name: Shell scripts (shellcheck)
        run: shellcheck test/*.sh skills/*/scripts/*.sh

      - name: Agent Skill (skills-ref, the Agent Skills reference validator)
        run: >-
          pipx run --spec "git+https://github.com/agentskills/agentskills@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref"
          skills-ref validate skills/firecrawl-local

      - name: Seccomp profile
        run: jq -e '.defaultAction == "SCMP_ACT_ERRNO"' seccomp_profile.json
