name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Workflows (actionlint, which shellchecks run steps)
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

      - name: Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Smoke test (shellcheck)
        run: shellcheck --severity=style test/*.sh

      - name: Compose file and seccomp profile
        run: |
          FIRECRAWL_LOCAL_TOKEN=lint docker compose -f compose.yaml config --quiet
          jq -e '.defaultAction == "SCMP_ACT_ERRNO"' seccomp_profile.json
