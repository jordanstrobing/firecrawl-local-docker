services:
  firecrawl-local:
    image: ghcr.io/jordanstrobing/firecrawl-local-docker:latest
    restart: unless-stopped
    # FIRECRAWL_HOSTNAME is the name clients use to reach this server, such as
    # its Tailscale name. Requests addressed to any other name are refused.
    command: [serve, --host, 0.0.0.0, --allowed-host, "${FIRECRAWL_HOSTNAME:-localhost}"]
    ports:
      - "${FIRECRAWL_BIND_ADDRESS:-127.0.0.1}:3002:3002"
    environment:
      FIRECRAWL_LOCAL_TOKEN: ${FIRECRAWL_LOCAL_TOKEN:?set FIRECRAWL_LOCAL_TOKEN in .env}
      FIRECRAWL_CLOUD: ${FIRECRAWL_CLOUD:-off}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
    volumes:
      # Keeps Firecrawl Local's install ID across updates.
      - firecrawl-home:/home/firecrawl
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp_profile.json
    # Chromium needs shared memory. The limits keep a runaway crawl or a
    # hostile page from exhausting the host's memory or process table.
    shm_size: 1gb
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 1024
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  firecrawl-home:
